name: Update cobe profile badge

on:
  schedule:
    - cron: '0 0 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Generate badge.gif and data.json
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          # Optional read-only token so the generator can see private repos.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_READ_TOKEN || github.token }}
          # Comma-separated allowlist: only these private repos appear publicly.
          PRIVATE_REPOS: noahotim/Teso-farm-doctor
        run: node badge/generate-badge.js
      - name: Commit badge and analytics data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update cobe profile badge data"
          file_pattern: 'badge.gif data.json commit-cache.json'
          branch: main
# trigger reindex for noahotim fork
